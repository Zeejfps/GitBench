name: release

# Push a SemVer tag (e.g. v1.2.3) to build + publish a release for every platform.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write          # the publish job uses GITHUB_TOKEN to create/attach release assets

jobs:
  # Compile the Icon Composer .icon once on an Apple Silicon runner (actool needs Xcode 26,
  # which is arm64-only) into Assets.car (macOS 26+ Liquid Glass) plus a backwards-compatible
  # AppIcon.icns rendered from the same source for older macOS. Both macOS build jobs consume it.
  icon:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Compile Icon Composer icon (Assets.car + icns)
        shell: bash
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          mkdir -p macicon
          xcrun actool GitBench/Assets/AppIcon.icon --compile macicon \
            --output-format human-readable-text --warnings --errors \
            --output-partial-info-plist macicon/partial.plist \
            --app-icon AppIcon --include-all-app-icons \
            --target-device mac --minimum-deployment-target 12.0 --platform macosx
          test -f macicon/Assets.car && test -f macicon/AppIcon.icns

      - uses: actions/upload-artifact@v7
        with:
          name: mac-icon
          path: macicon/
          if-no-files-found: error

  # Build + Velopack-pack each platform on its own runner (Native AOT can't cross-compile),
  # then hand the packaged output to the publish job as an artifact. No job touches GitHub
  # Releases here, so the matrix jobs never race over who creates the release.
  build:
    needs: icon
    strategy:
      fail-fast: false     # one platform failing shouldn't abandon the others
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: win-x64
            exe: GitBench.exe
            icon: GitBench/Assets/app_icon.ico
            extra: ""
          - os: macos-latest          # Apple Silicon runner
            rid: osx-arm64
            channel: osx-arm64
            exe: GitBench
            icon: macicon/AppIcon.icns
            extra: "--bundleId com.builtbyzee.gitbench"
          - os: macos-15-intel         # Intel runner (macos-13 was retired Dec 2025)
            rid: osx-x64
            channel: osx-x64
            exe: GitBench
            icon: macicon/AppIcon.icns
            extra: "--bundleId com.builtbyzee.gitbench"
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux-x64
            exe: GitBench
            icon: GitBench/Assets/app_icon.png
            extra: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # .gitmodules points at the framework over SSH, but the repo is public — rewrite to
      # HTTPS so the default runner credentials can clone it (no deploy key needed).
      - name: Init public submodule over HTTPS
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Ensure global tools on PATH
        shell: bash
        run: echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Pin vpk to the same version as the Velopack library referenced by the app, so the
      # generated release feed matches what the installed app's UpdateManager expects.
      - name: Install vpk
        shell: bash
        run: dotnet tool install -g vpk --version 1.1.1

      - name: Compute version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"   # v1.2.3 -> 1.2.3

      - name: Download compiled macOS icon
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v8
        with:
          name: mac-icon
          path: macicon

      - name: Publish (Native AOT, per-RID)
        shell: bash
        run: >
          dotnet publish GitBench/GitBench.csproj
          -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.ver.outputs.version }}
          -o publish/${{ matrix.rid }}

      # Hand vpk a pre-built .app on macOS so the bundle carries Assets.car + CFBundleIconName
      # (macOS 26 only themes icons it resolves from the bundle; --icon/--plist alone can't get
      # Assets.car into Contents/Resources). vpk copies a .app packDir verbatim into
      # <packTitle>.app and still injects its updater bits, so update identity is unchanged.
      - name: Assemble macOS .app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=bundle/GitBench.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R publish/${{ matrix.rid }}/. "$APP/Contents/MacOS/"
          cp macicon/Assets.car macicon/AppIcon.icns "$APP/Contents/Resources/"
          sed "s/__VERSION__/${{ steps.ver.outputs.version }}/g" GitBench/Info.plist.in > "$APP/Contents/Info.plist"

      - name: Choose pack directory
        id: packdir
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "dir=bundle/GitBench.app" >> "$GITHUB_OUTPUT"
          else
            echo "dir=publish/${{ matrix.rid }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        shell: bash
        run: >
          vpk pack
          --packId GitBench
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir ${{ steps.packdir.outputs.dir }}
          --mainExe ${{ matrix.exe }}
          --packTitle GitBench
          --packAuthors Zeejfps
          --channel ${{ matrix.channel }}
          --runtime ${{ matrix.rid }}
          --icon ${{ matrix.icon }}
          ${{ matrix.extra }}

      # vpk writes per-channel asset names, so the four artifacts merge cleanly later.
      - name: Upload packaged release as artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.channel }}
          path: Releases/
          if-no-files-found: error

  # All platforms are packed — collect every channel's assets into one folder and publish a
  # single GitHub Release with `gh`. We deliberately do NOT use `vpk upload github`: vpk creates
  # the release as a draft then publishes it, and publishing a draft makes GitHub try to create
  # the git tag, which already exists (we pushed it to trigger) -> 422 "tag_name already_exists".
  # `gh release create` instead binds a published release to the existing tag, and `vpk pack`
  # already wrote each channel's releases.<channel>.json feed + installers, so uploading those
  # assets directly is all the app's UpdateManager needs.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect all channels into one folder
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: Releases
          merge-multiple: true

      - name: Compute version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Start clean: drop any prior/partial release for this tag (keeps the git tag itself),
          # then create a fresh published release bound to the existing tag.
          gh release delete "$tag" --repo Zeejfps/GitBench --yes 2>/dev/null || true
          gh release create "$tag" \
            --repo Zeejfps/GitBench \
            --title "GitBench ${{ steps.ver.outputs.version }}" \
            --generate-notes
          # Upload every packaged asset (nupkgs, installers, portable, releases.<channel>.json),
          # excluding vpk's local build metadata which the update feed doesn't reference.
          mapfile -t files < <(find Releases -type f ! -name 'assets.*.json')
          printf 'Uploading: %s\n' "${files[@]}"
          gh release upload "$tag" "${files[@]}" --repo Zeejfps/GitBench --clobber
